name: Clasp Push

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync to Apps Script'
        required: true
        default: 'master'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Write clasp project config
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Push to Apps Script
        run: clasp push --force
